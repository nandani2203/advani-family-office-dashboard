name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API — typecheck, unit and e2e
    runs-on: ubuntu-latest

    # The e2e suite talks to a real Postgres, because that is what it is for:
    # the raw SQL in the dashboard aggregation is not exercised by a mock.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: allocations_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/allocations_test?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/allocations_test?schema=public
      JWT_SECRET: ci-access-secret-that-is-at-least-32-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-that-is-at-least-32-characters
      OPEN_SIGNUP: 'true'
      EXPOSE_OTP: 'true'
      OTP_RESEND_SECONDS: '0'
      CORS_ORIGINS: '*'

    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install
        run: npm ci

      - name: Create the shadow database
        # `migrate diff --from-migrations` resets whatever database it is pointed
        # at, so it gets its own rather than the one the tests use.
        run: psql "$DIRECT_URL" -c 'CREATE DATABASE allocations_shadow'
        env:
          PGPASSWORD: postgres

      - name: Check the migration matches the schema
        # The initial migration was hand-authored, so verify it still describes
        # exactly what schema.prisma declares. A non-zero exit means they differ.
        run: >-
          npx prisma migrate diff
          --from-migrations ./prisma/migrations
          --to-schema-datamodel ./prisma/schema.prisma
          --shadow-database-url "$SHADOW_DATABASE_URL"
          --exit-code
        env:
          SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/allocations_shadow?schema=public

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --ci

      - name: Seed
        run: npm run seed

      - name: E2E tests
        run: npm run test:e2e

  web:
    name: Web — typecheck, lint and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    env:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
